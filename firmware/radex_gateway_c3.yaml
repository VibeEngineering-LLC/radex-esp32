# ======================================================================
#  radex_gateway_s3_n16r8.yaml - Radex MR107ion BLE -> Web UI
#  Плата: ESP32-S3-DevKitC-1 N16R8 (16 MB Flash, 8 MB PSRAM octal)
#
#  Та же плата, что в проекте AtomSpectra-водопад. Версия отличается от
#  базового radex_gateway_s3.yaml тремя вещами:
#
#  1. ПРОФИЛЬ ПЛАТЫ.
#     - esp32.flash_size: 16MB. Без этого ESPHome берёт дефолт 4MB
#       (esphome/components/esp32/__init__.py:1575) и на N16R8 используется
#       четверть флеша: раздел приложения меньше, чем позволяет плата.
#     - psram: mode octal, speed 80MHz. На arduino-фреймворке компонент
#       ставит board_build.arduino.memory_type = qio_opi
#       (esphome/components/psram/__init__.py:178-181) - это и есть N16R8.
#       Без блока psram 8 MB внешней памяти платой не используются вовсе.
#
#  2. АВТОПОИСК ПРИБОРА (MAC не зашит в прошивку).
#     Базовая версия требовала MAC прибора на этапе компиляции
#     (ble_client.mac_address - cv.Required, ble_client/__init__.py:76),
#     поэтому бинарник годился только своему автору. Здесь MAC
#     подставляется в рантайме:
#       - ble_client объявлен с плейсхолдером 00:00:00:00:00:00 (валиден,
#         config_validation.py:1159-1175), при нулевом адресе клиент спит:
#         parse_device() выходит по address_ == 0 (ble_client_base.cpp:95-111);
#       - лямбда on_ble_advertise ищет в эфире Radex по имени (MR107*/Radex*)
#         или по сервису FE651700-...-8AAA и вызывает set_address()
#         (ble_client_base.h:51) + set_remote_addr_type() (.h:85);
#       - дальше штатный auto_connect подключается сам на следующем
#         adv-пакете; connect() из лямбды НЕ вызывается - он обошёл бы
#         stop_scan_() (esp32_ble_tracker.cpp:900-923);
#       - найденный MAC и тип адреса лежат в NVS (globals restore_value),
#         после ребута адрес ставится в on_boot без ожидания эфира. Тип адреса
#         ESPHome и сам восстанавливает из рекламы, когда находит прибор
#         (parse_device, ble_client_base.cpp:109), так что хранение типа -
#         подстраховка на случай ручного пути, а не условие работы.
#     Ручной ввод MAC через Web UI сохранён и имеет приоритет над эфиром.
#
#  3. ПУБЛИЧНАЯ СБОРКА: api без encryption-ключа. Ключ в общем бинарнике
#     не даёт защиты (одинаков у всех) - кому нужен, добавляет блок
#     encryption и пересобирает. Web UI при этом закрыт Basic Auth.
#
#  Наследуется без изменений от базовой версии: READ-poll хук по GATT
#  (include/radex_read_hook.h), скользящие средние час/сутки, Web Server v3
#  с sorting_groups, инфраструктура Народмона (ВЫКЛЮЧЕНА, switch имеет
#  restore_mode: ALWAYS_OFF - safety-критично).
# ======================================================================

substitutions:
  device_name: radex-gw-c3
  device_friendly: "Radex Gateway C3"
  # Локальный путь — переопределите под свою систему (вынесен из C:\Users\... во избежание UnicodeDecodeError).
  build_path: ./.esphome_build/radex-gw-c3

esphome:
  name: ${device_name}
  friendly_name: ${device_friendly}
  comment: "Radex MR107ion -> Web UI (ESP32-S3, arduino, Narodmon infra OFF)"
  min_version: 2025.8.0
  build_path: ${build_path}
  includes:
    - include/esp_diag.h
    - include/radex_read_hook.h
  on_boot:
    priority: -300
    then:
      - lambda: |-
          id(ble_connects).publish_state((float) id(ble_connect_count));
          id(ble_disconnects).publish_state((float) id(ble_disconnect_count));
          ESP_LOGI("boot", "Radex Gateway S3 step3 (arduino, Narodmon infra OFF by default) booted, web UI: http://%s.local/", "${device_name}");
          // ── Адрес прибора: ручной ввод > запомненный в NVS > поиск в эфире ──
          auto parse_mac = [](const std::string &s) -> uint64_t {
            if (s.length() != 17) return 0;
            uint64_t m = 0;
            for (int i = 0; i < 6; i++) {
              char h[3] = { s[i*3], s[i*3+1], 0 };
              char *end = nullptr;
              long v = strtol(h, &end, 16);
              if (end == h || v < 0 || v > 255) return 0;
              m = (m << 8) | (uint8_t)v;
            }
            return m;
          };
          uint64_t manual = parse_mac(id(mac_radex).state);
          if (manual) {
            // Ручной ввод старше автопоиска: пользователь знает, какой прибор ему нужен.
            id(ble_radex).set_address(manual);
            // ДЕФЕКТ, найденный 2026-08-26 на живой плате C3: set_address() НЕ меняет
            // тип адреса, он остаётся дефолтным PUBLIC. У приборов Quarta-Rad адрес
            // RANDOM (подтверждено: btsnoop телефона кадр 142 "Peer Address Type:
            // Random Device Address (0x01)"), поэтому auto_connect сверял рекламу с
            // public-адресом, совпадения не было НИКОГДА и попыток подключения не
            // возникало вовсе - счётчики "реконнектов/успешных коннектов" стояли на 0
            // при живом приборе в эфире (проверено сканом с ПК: MR107ion 0166, -63 dBm).
            // Ветка "MAC из памяти" тип задаёт (ниже), ветка ручного ввода - не задавала.
            id(ble_radex).set_remote_addr_type(BLE_ADDR_TYPE_RANDOM);
            // Записываем ручной адрес в те же переменные, что и автопоиск: иначе
            // диагностический лог RSSI (ниже, on_ble_advertise) сравнивает рекламу
            // с нулём и молчит - становится невозможно отличить "плата не слышит
            // прибор" от "слышит, но не подключается". Найдено 2026-08-26 на C3.
            id(radex_mac_nvs) = manual;
            id(radex_addr_type_nvs) = (uint8_t) BLE_ADDR_TYPE_RANDOM;
            esphome::radex_hook::set_long_supervision_timeout(manual);
            ESP_LOGI("radex", "MAC задан вручную: %s (тип адреса RANDOM)",
                     id(mac_radex).state.c_str());
          } else if (id(radex_mac_nvs) != 0) {
            // Прибор уже найден в прошлой жизни платы - не ждём эфира.
            id(ble_radex).set_address(id(radex_mac_nvs));
            id(ble_radex).set_remote_addr_type((esp_ble_addr_type_t) id(radex_addr_type_nvs));
            esphome::radex_hook::set_long_supervision_timeout(id(radex_mac_nvs));
            ESP_LOGI("radex", "MAC из памяти: %012llX", (unsigned long long) id(radex_mac_nvs));
          } else {
            ESP_LOGI("radex", "MAC неизвестен - ищу прибор Radex в эфире");
          }

          // МАКСИМАЛЬНАЯ МОЩНОСТЬ BLE (2026-08-27). Дефолт ESP32-C3 - всего +3 dBm,
          // чип умеет до +20 (ESP_PWR_LVL_P20 = 15, сверено с esp_bt.h семейства c3).
          // Влияет не только на дальность: при активном скане плата сама шлёт запрос
          // имени (SCAN_REQ), и на малой мощности он не долетает - в эфире тогда все
          // устройства без имён, а автопоиск прибора here ищет именно по имени MR107*.
          {
            static const esp_ble_power_type_t pwr_types[] = {
              ESP_BLE_PWR_TYPE_DEFAULT, ESP_BLE_PWR_TYPE_ADV,
              ESP_BLE_PWR_TYPE_SCAN,    ESP_BLE_PWR_TYPE_CONN_HDL0,
            };
            for (size_t i = 0; i < sizeof(pwr_types)/sizeof(pwr_types[0]); i++) {
              esp_err_t pe = esp_ble_tx_power_set(pwr_types[i], ESP_PWR_LVL_P20);
              ESP_LOGI("radex", "TX power type=%d set=%s level=%d",
                       (int) pwr_types[i], pe == ESP_OK ? "OK" : "FAIL",
                       (int) esp_ble_tx_power_get(pwr_types[i]));
            }
          }
          // #RADEX-4 H1 (2026-08-24): голый ble_client: (в отличие от bluetooth_proxy)
          // никогда не вызывает set_connection_type() -> connection_type_ остаётся
          // дефолтным V1 (esp32_ble_client/ble_client_base.h:125), и connect() для V1
          // осознанно НЕ выставляет conn params (ble_client_base.cpp:141: "For V1/Legacy,
          // don't set params - use ESP-IDF defaults"). Комментарий авторов там же
          // (ble_client_base.cpp:16-18): "ESP-IDF defaults (12.5-15ms) are too slow for
          // stable connections... causing disconnections" - ровно наш симптом (rsn 0x3e/0x8).
          // V3_WITH_CACHE - медленнее FAST, но держит кэш сервисов в RAM, что подходит
          // READ-poll паттерну MR107ion (повторные чтения одних и тех же характеристик).
          // ОТКАЧЕНО (2026-08-24, #RADEX-4 H1 ❌): 10-мин тест дал rsn 0x8 в 7/7 попыток,
          // 0 успешных on_connect, лишь лёгкий сдвиг длительности сессий (~8.7с -> ~9.2с,
          // недостаточно). См. лог тиков брифа radex-ble-loop-run-2026-08-24.md. Оставлено
          // закомментированным - может пригодиться в комбинации с другой правкой (H0/H2/H3).
          // id(ble_radex).set_connection_type(esphome::esp32_ble_tracker::ConnectionType::V3_WITH_CACHE);

esp32:
  board: seeed_xiao_esp32c3
  variant: esp32c3
  # N16R8: 16 MB флеша. Дефолт ESPHome - 4MB, на этой плате он режет
  # раздел приложения вчетверо (esp32/__init__.py:1575).
  flash_size: 4MB
  framework:
    type: arduino

# 8 MB внешней PSRAM в октальном режиме - вторая половина маркировки N16R8.
# На arduino компонент выставляет memory_type qio_opi (psram/__init__.py:178-181).
# H0-тест ОТКАЧЕН (2026-08-24, #RADEX-4): без psram: частота попыток BLE-подключения резко
# упала (0 попыток в 2/2 чистых 10-мин окон, вместо стабильных 5-7/10мин на baseline/H1),
# а сами попытки, когда случались, давали ту же смесь rsn 0x8/0x3e/status=133 - улучшения
# нет, есть побочная деградация. См. лог тиков radex-ble-loop-run-2026-08-24.md.

logger:
  # ⚠ DEBUG ВРЕМЕННО ОТКЛЮЧЁН (2026-08-24, #RADEX-4 тик 0b): после прошивки с
  # level:DEBUG плата зависла намертво — ping отвечает (TTL=64), но HTTP не
  # отвечает (curl timeout), И serial COM4 отдаёт ТОЛЬКО ROM-баннер (231Б) при
  # ручном reset, дальше 0 байт даже за 40с (app-логи вообще не появляются —
  # похоже на крах/зависание ДО или ВО ВРЕМЯ инициализации логгера, не на
  # штатную работу с редким выводом). На level:INFO та же плата держала HTTP
  # стабильно весь тик 0 (частичный baseline). Новая гипотеза H_debug: сама
  # DEBUG-верboseность (не наш убранный ESP_LOGD) роняет плату при активном
  # BLE-сканировании. Проверяется тестом ниже, см. лог тиков брифа. На INFO
  # BT_HCI-строки (rsn 0x3e/0x8) не видны — временный компромисс, известный.
  # #RADEX-4 H13 (2026-08-25, было по явному согласию оператора): глобальный DEBUG НЕ
  # повесил плату в этот раз (в отличие от 24.08) - собрал самый информативный FSM-лог
  # за всю петлю (radex4_h13_debug_sse.txt). Откачено обратно на INFO по умолчанию для
  # стабильности следующей сессии - DEBUG включать заново по явному запросу, не молча.
  level: INFO
  baud_rate: 115200
  # #RADEX-4 H12 (2026-08-25) ПОПЫТКА ОТКАЧЕНА: хотел точечный DEBUG для esp32_ble_client
  # (см. цель ниже), но ESPHome logger НЕ позволяет per-tag override быть строже
  # глобального level - "log level for esp32_ble_client (DEBUG) must not be less severe
  # than the global log level (INFO)". Единственный путь - поднять ГЛОБАЛЬНЫЙ level до
  # DEBUG, а это H_debug (плата зависает ДО инициализации приложения, не из-за объёма
  # логов во время сканирования - см. лог тиков 24.08 ~22:00). НЕ пробовать без явного
  # согласия оператора и его присутствия рядом с платой (обычный pyserial RTS-reset не
  # спасёт зависание при полностью обесточенной плате). Цель, если решимся: увидеть,
  # почему 10с safety timeout (ESP_LOGE "Timeout waiting for CLOSE_EVT... forcing IDLE",
  # ble_client_base.cpp:68) ни разу не сработал за всю петлю, хотя код формально готов
  # (set_disconnecting_() уже вызывает enable_loop(), ble_client_base.h:161).

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none
  output_power: 8.5dB
  ap:
    ssid: "radex-gw-s3 Fallback"
    password: !secret ap_password

# Публичная сборка: без encryption-ключа. Общий для всех ключ защитой не является;
# кому нужно шифрование HA-API - добавляет сюда блок encryption и пересобирает.
api:
  reboot_timeout: 0s

ota:
  - platform: esphome
    id: ota_esphome
    password: !secret ota_password
  - platform: web_server

# HARD-правила проекта:
#   - log: true   → ИСКЛЮЧЕНИЕ для S3 (2026-06-17, оператор): нативная вкладка
#                   логов в Web UI v3. Если пойдут ребуты / json:111 / OOM —
#                   откатить в false без переспроса и доложить (INC-05-like).
#                   Аналогичное исключение действует для C3 (radon_ha_gateway_c3).
#   - auth        → срезает phantom XRay keep-alive на 401 (INC-10).
web_server:
  version: 3
  port: 80
  include_internal: false
  local: true
  log: true
  auth:
    username: !secret web_server_auth_user
    password: !secret web_server_auth_pass
  sorting_groups:
    - id: sg_data
      name: "Данные"
      sorting_weight: 10
    - id: sg_service
      name: "Сервис"
      sorting_weight: 20

captive_portal:

mdns:
  disabled: false

time:
  - platform: sntp
    id: sntp_time
    timezone: Europe/Moscow

# HTTP-клиент для Народмона. verify_ssl: false — на arduino+S3 root CA
# bundle не подгружается; HTTPS handshake работает без проверки серта.
http_request:
  verify_ssl: false
  timeout: 5s
  useragent: "esphome-radex-gw-s3/1.0"

# Источник данных для датчиков памяти ниже.
debug:
  update_interval: 60s

esp32_ble_tracker:
  scan_parameters:
    interval: 640ms
    window: 32ms
    # active: true обязателен - имя прибора и список сервисов часто приходят
    # не в самой рекламе, а в scan response.
    active: true
  on_ble_advertise:
    then:
      - lambda: |-
          // #RADEX-4 (2026-08-26): видимость BLE RSSI прибора на уровне INFO.
          // Установлено фактом (DEBUG-лог radex4_h13_debug_sse.txt): при 50 см до
          // прибора RSSI = -81/-83 dBm - аномально слабо (норма для 50 см: -45..-55),
          // и именно из-за потери пакетов discovery не долетает, а не потому что
          // прибор "медленный". Без этого лога силу сигнала видно только в DEBUG,
          // который заливает канал шумом. Троттлинг 10с, только наш прибор.
          {
            // ДИАГНОСТИКА СКАНА (2026-08-26, C3): раз в 10 с печатаем, сколько
            // рекламных пакетов от СКОЛЬКИХ устройств поймано. Это отделяет
            // "скан вообще не работает / антенна не подключена" от
            // "эфир слышим, но конкретного прибора в нём нет".
            static uint32_t adv_total = 0;
            static uint32_t last_stat_log = 0;
            adv_total++;
            uint32_t now_stat = millis();
            if (now_stat - last_stat_log > 10000) {
              last_stat_log = now_stat;
              ESP_LOGI("scan", "эфир: пакетов рекламы всего=%u", (unsigned) adv_total);
            }

            uint64_t want = id(radex_mac_nvs);
            if (want != 0 && x.address_uint64() == want) {
              static uint32_t last_rssi_log = 0;
              uint32_t now_ms = millis();
              if (now_ms - last_rssi_log > 10000) {
                last_rssi_log = now_ms;
                ESP_LOGI("radex", "BLE RSSI прибора: %d dBm  имя='%s'",
                         x.get_rssi(), x.get_name().c_str());
              }
            }
          }

          // Вызывается на КАЖДЫЙ пакет от КАЖДОГО устройства - выходим сразу,
          // если адрес прибора уже известен.
          if (id(radex_mac_nvs) != 0) return;
          if (id(mac_radex).state.length() == 17) return;  // задан вручную

          std::string n = x.get_name();
          bool match = (n.rfind("MR107", 0) == 0) ||
                       (n.rfind("Radex", 0) == 0) ||
                       (n.rfind("RADEX", 0) == 0) ||
                       (n.rfind("radex", 0) == 0);

          // Запасной признак - фирменный сервис Quarta-Rad в рекламе.
          // В reference скилла соседствуют два написания хвоста (8AAA у сервиса,
          // 8AAB у характеристик), поэтому принимаем оба: лишняя проверка дешевле
          // непойманного прибора.
          if (!match) {
            static const auto SVC_A = esp32_ble_tracker::ESPBTUUID::from_raw(
                "fe651700-00b0-4240-ba50-05ca45bf8aaa");
            static const auto SVC_B = esp32_ble_tracker::ESPBTUUID::from_raw(
                "fe651700-00b0-4240-ba50-05ca45bf8aab");
            for (auto &u : x.get_service_uuids()) {
              if (u == SVC_A || u == SVC_B) { match = true; break; }
            }
          }
          if (!match) return;

          id(radex_mac_nvs) = x.address_uint64();
          id(radex_addr_type_nvs) = (uint8_t) x.get_address_type();
          // connect() здесь вызывать НЕЛЬЗЯ: он обойдёт stop_scan_()
          // (esp32_ble_tracker.cpp:900-923). Ставим адрес - auto_connect
          // подключится сам на следующем пакете рекламы.
          id(ble_radex).set_address(id(radex_mac_nvs));
          id(ble_radex).set_remote_addr_type(x.get_address_type());
          esphome::radex_hook::set_long_supervision_timeout(id(radex_mac_nvs));
          id(found_mac).publish_state(x.address_str());
          ESP_LOGI("radex", "Найден прибор: %s  имя='%s'  RSSI=%d dBm",
                   x.address_str().c_str(), n.c_str(), x.get_rssi());

esp32_ble:
  max_connections: 1

# #RADEX-4 (2026-08-26): прибор MR107ion FW 1.8 сам, первым, шлёт Exchange MTU Request
# и не обслуживает ничего, пока не получит ATT-ответ. Без GATTS-приложения Bluedroid
# молчит. esp32_ble_server: регистрирует GATTS-приложение — есть чем ответить.
# Эталон снят с телефона (btsnoop): кадры 151/152 в references/radex-ble-loop-run-2026-08-24.md.
esp32_ble_server:

# bluetooth_proxy УБРАН (2026-06-21): WiFi-интерференция 2.4 ГГц.

globals:
  # Найденный в эфире прибор. Переживает перезагрузку, поэтому искать заново
  # после каждого ребута не нужно (globals/__init__.py:47 -> NVS).
  - id: radex_mac_nvs
    type: uint64_t
    restore_value: true
    initial_value: '0'
  # Тип адреса (public/random) хранится рядом с самим адресом. set_address()
  # тип не меняет и оставляет значение по умолчанию, PUBLIC
  # (ble_client_base.h:124), поэтому при ручной установке адреса тип надо
  # задавать отдельно. На пути через эфир этим занимается сам ESPHome:
  # parse_device() присваивает remote_addr_type_ из рекламы при каждом
  # совпадении адреса (ble_client_base.cpp:109). Так что запись здесь -
  # подстраховка, а не условие работы.
  - id: radex_addr_type_nvs
    type: uint8_t
    restore_value: true
    initial_value: '0'

  - id: ble_connect_count
    type: uint32_t
    restore_value: false
    initial_value: '0'
  - id: ble_disconnect_count
    type: uint32_t
    restore_value: false
    initial_value: '0'

  # #RADEX-4 (2026-08-25): курсор round-robin READ-цикла (radex_read_hook).
  # ВАЖНО: сбрасывается на 0 (=0x0049 radon_last, см. handles[] в interval-
  # лямбде ниже) при КАЖДОМ on_connect. Раньше курсор жил только как static
  # внутри interval-лямбды и НЕ сбрасывался между переподключениями - после
  # нескольких обрывов к моменту нового Connection open курсор мог указывать
  # на любой из 4 хэндлов не по порядку. Сессии живут 5-16с, полный цикл по
  # 4 хэндлам = 17.2с (4 * 4.3с) - НИ ОДНА сессия за всю петлю #RADEX-4 не
  # была достаточно долгой, чтобы дочитать все 4 без сброса курсора; без
  # гарантии, что радон читается ПЕРВЫМ, скачка данных не было бы вообще
  # ни при каких обстоятельствах короче 17.2с.
  - id: radex_read_cursor
    type: uint8_t
    restore_value: false
    initial_value: '0'

ble_client:
  # Нулевой адрес - штатный способ сказать "прибор пока неизвестен":
  # схема требует mac_address (ble_client/__init__.py:76), а parse_device()
  # при address_ == 0 просто не подключается (ble_client_base.cpp:95-111).
  # Реальный адрес ставится в рантайме - из NVS в on_boot или из эфира.
  - mac_address: "00:00:00:00:00:00"
    id: ble_radex
    auto_connect: true
    on_connect:
      - lambda: |-
          id(ble_connect_count) += 1;
          ESP_LOGI("radex", "===== Radex CONNECTED (#%u) =====", (unsigned) id(ble_connect_count));
          id(ble_connects).publish_state((float) id(ble_connect_count));
          id(ble_connected).publish_state(true);
          // #RADEX-4: гарантируем, что radon_last (handles[0]=0x0049) читается
          // ПЕРВЫМ в любой, даже самой короткой сессии - см. globals.radex_read_cursor.
          id(radex_read_cursor) = 0;
          // #RADEX-4: READ-интервал (4300мс) тикает независимо от момента connect -
          // без немедленного READ здесь можно ждать до 4.3с первого чтения, а часть
          // сессий рвётся уже через ~5с (control test: 5.1-6.4с). Читаем 0x0049
          // (radon_last) СРАЗУ, не дожидаясь ближайшего тика интервала.
          {
            esp_gatt_if_t if_g = (esp_gatt_if_t) id(ble_radex).get_gattc_if();
            uint16_t conn = id(ble_radex).get_conn_id();
            esp_err_t e = esp_ble_gattc_read_char(if_g, conn, 0x0049, ESP_GATT_AUTH_REQ_NONE);
            if (e != ESP_OK) ESP_LOGW("radex_poll", "immediate READ h=0x0049 ret=%d", e);
            // Курсор уже отработал handles[0]=0x0049 здесь - следующий тик таймера
            // должен пойти на handles[1], иначе повторно перечитает тот же радон.
            id(radex_read_cursor) = 1;
          }
    on_disconnect:
      - lambda: |-
          id(ble_disconnect_count) += 1;
          ESP_LOGW("radex", "Radex DISCONNECT (#%u)", (unsigned) id(ble_disconnect_count));
          id(ble_disconnects).publish_state((float) id(ble_disconnect_count));
          id(ble_connected).publish_state(false);

sensor:
  # #RADEX-4 (2026-08-25): RSSI активного GATT-соединения. Опрос каждые 2с - сессии
  # держатся 5-16с, дефолтный poll 60s почти никогда не попал бы в окно подключения.
  # Цель: объективно отличить "плата/место далеко от прибора, слабый сигнал" от
  # "прибор физически исправен, сигнал хороший, разрыв всё равно есть" (см. переломный
  # контрольный тест в radex-ble-loop-run-2026-08-24.md, тик "КОНТРОЛЬНЫЙ ТЕСТ").
  - platform: ble_client
    type: rssi
    ble_client_id: ble_radex
    name: "BLE: RSSI прибора"
    id: radex_rssi
    update_interval: 2s
    entity_category: diagnostic
    web_server:
      sorting_group_id: sg_service
      sorting_weight: 25

  # ─── ПАМЯТЬ (диагностика) ───
  # Свободная PSRAM показывает, работает ли внешняя память платы N16R8.
  # Пустое значение или ноль - её нет: либо плата не N16R8, либо прошивка
  # собрана без блока psram (ровно этот случай разобран в инциденте P-020).
  - platform: debug
    free:
      name: "Свободная память"
      id: heap_free
      entity_category: diagnostic
      web_server:
        sorting_group_id: sg_service
        sorting_weight: 190

  # ─── ДАННЫЕ (sg_data) ───
  - platform: template
    name: "ОА радона (последняя)"
    id: radon_last
    unit_of_measurement: "Bq/m³"
    accuracy_decimals: 1
    icon: "mdi:radioactive"
    update_interval: never
    web_server:
      sorting_group_id: sg_data
      sorting_weight: 10

  - platform: template
    name: "ОА радона (среднее, прибор)"
    id: radon_avg_device
    unit_of_measurement: "Bq/m³"
    accuracy_decimals: 1
    icon: "mdi:radioactive-circle"
    update_interval: never
    web_server:
      sorting_group_id: sg_data
      sorting_weight: 20

  # ── step2 (2026-06-17): скользящие средние ОА за час и за день ──
  # Сэмплируем radon_last каждые 60 с; sliding_window_moving_average даёт
  # rolling-average по окну. Сэмплы при отсутствии BLE-связи отбрасываются
  # (lambda возвращает NaN → filter_out: nan), чтобы зомби-значения не
  # засоряли среднее. До наполнения окна публикуется среднее доступных
  # сэмплов (send_first_at: 1, send_every: 1 → виден сразу после первого
  # BLE-чтения, обновляется ежеминутно).
  #   hour: window 60 × 60 c = 60 минут; ~240 байт.
  #   day : window 1440 × 60 c = 24 часа; ~5.6 KB DRAM.
  - platform: template
    name: "ОА радона (среднее, час)"
    id: radon_avg_hour
    unit_of_measurement: "Bq/m³"
    accuracy_decimals: 1
    icon: "mdi:timer-outline"
    state_class: measurement
    update_interval: 60s
    lambda: |-
      if (id(radon_last).has_state() && id(ble_radex).connected()) {
        return id(radon_last).state;
      }
      return NAN;
    filters:
      - filter_out: nan
      - sliding_window_moving_average:
          window_size: 60
          send_every: 1
          send_first_at: 1
    web_server:
      sorting_group_id: sg_data
      sorting_weight: 25

  - platform: template
    name: "ОА радона (среднее, день)"
    id: radon_avg_day
    unit_of_measurement: "Bq/m³"
    accuracy_decimals: 1
    icon: "mdi:calendar-today"
    state_class: measurement
    update_interval: 60s
    lambda: |-
      if (id(radon_last).has_state() && id(ble_radex).connected()) {
        return id(radon_last).state;
      }
      return NAN;
    filters:
      - filter_out: nan
      - sliding_window_moving_average:
          window_size: 1440
          send_every: 1
          send_first_at: 1
    web_server:
      sorting_group_id: sg_data
      sorting_weight: 27

  - platform: template
    name: "Температура"
    id: temp_radex
    unit_of_measurement: "°C"
    accuracy_decimals: 1
    icon: "mdi:thermometer"
    device_class: temperature
    state_class: measurement
    update_interval: never
    web_server:
      sorting_group_id: sg_data
      sorting_weight: 30

  - platform: template
    name: "Влажность"
    id: humidity_radex
    unit_of_measurement: "%"
    accuracy_decimals: 1
    icon: "mdi:water-percent"
    device_class: humidity
    state_class: measurement
    update_interval: never
    web_server:
      sorting_group_id: sg_data
      sorting_weight: 40

  - platform: uptime
    name: "Время работы"
    id: esp_uptime
    update_interval: 30s
    web_server:
      sorting_group_id: sg_data
      sorting_weight: 50

  # ─── СЕРВИС (sg_service) ───
  - platform: wifi_signal
    name: "WiFi сигнал"
    id: wifi_rssi
    update_interval: 30s
    entity_category: diagnostic
    web_server:
      sorting_group_id: sg_service
      sorting_weight: 10

  - platform: template
    name: "BLE: успешных коннектов"
    id: ble_connects
    accuracy_decimals: 0
    icon: "mdi:bluetooth-connect"
    update_interval: never
    entity_category: diagnostic
    web_server:
      sorting_group_id: sg_service
      sorting_weight: 20

  - platform: template
    name: "BLE: реконнектов всего"
    id: ble_disconnects
    accuracy_decimals: 0
    icon: "mdi:bluetooth-off"
    update_interval: never
    entity_category: diagnostic
    web_server:
      sorting_group_id: sg_service
      sorting_weight: 30

binary_sensor:
  - platform: template
    name: "BLE: Radex подключён"
    id: ble_connected
    device_class: connectivity
    icon: "mdi:bluetooth"
    web_server:
