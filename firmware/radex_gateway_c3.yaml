# ── Народмон switch + select + editable metric names ──
# HARD: restore_mode: ALWAYS_OFF — после ребута/safe_mode switch ВСЕГДА OFF,
# не зависит от прошлого состояния. Это критическая часть соблюдения
# БАН Народмон HARD HOLD (2026-06-14).
switch:
  - platform: template
    name: "Выгружать на Народмон"
    # restore_mode идёт первым параметром после name намеренно: значение
    # safety-критично, и его место в файле закреплено правилом контура.
    restore_mode: ALWAYS_OFF
    id: narodmon_enabled
    icon: "mdi:cloud-upload"
    optimistic: true
    web_server:
      sorting_group_id: sg_service
      sorting_weight: 210

# Выбор протокола (по narodmon-iot SKILL.md):
#   HTTP GET   — параметры в URL, endpoint http://narodmon.ru/get
#   HTTP POST  — те же поля form-encoded, endpoint http://narodmon.ru/post
#   HTTPS POST — то же тело через TLS на https://narodmon.ru/post
#                (тяжелее mbedTLS handshake).
#   JSON POST  — JSON-тело на http://narodmon.ru/json, ответ тоже JSON.
select:
  - platform: template
    name: "Способ отправки на Народмон"
    id: narodmon_method
    icon: "mdi:upload-network"
    optimistic: true
    restore_value: true
    initial_option: "HTTP GET"
    options:
      - "HTTP GET"
      - "HTTP POST"
      - "HTTPS POST"
      - "JSON POST"
    web_server:
      sorting_group_id: sg_service
      sorting_weight: 220

text:
  # Runtime BLE MAC — задаётся через Web UI после прошивки.
  # После сохранения нажать кнопку "Применить MAC и перезагрузить".
  - platform: template
    name: "MAC Radex (AA:BB:CC:DD:EE:FF)"
    id: mac_radex
    optimistic: true
    restore_value: true
    initial_value: ""
    mode: text
    max_length: 17
    icon: "mdi:bluetooth"
    web_server:
      sorting_group_id: sg_service
      sorting_weight: 155

  - platform: template
    name: "Имя метрики: радон"
    id: nm_radon
    optimistic: true
