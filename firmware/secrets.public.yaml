# ─── secrets для ПУБЛИЧНОЙ сборки radex_gateway_s3_n16r8.yaml ───
#
# Именно с этим файлом собран бинарник firmware.factory.bin в релизе.
# Здесь нет ничьих настоящих паролей: сеть и прибор задаются уже после
# прошивки, через точку доступа платы.
#
# Хотите повторить релизную сборку — скопируйте этот файл в secrets.yaml.
# Делаете прошивку для себя — впишите в secrets.yaml свои значения:
# плата подключится к домашней сети сразу и точку доступа поднимать не станет.

# Заведомо несуществующая сеть. Не найдя её, плата поднимает свою точку
# доступа с captive portal — в нём и выбирается настоящая сеть.
wifi_ssid: "radex-gw-setup"
wifi_password: "radex-gw-setup"

# Пароль точки доступа 'radex-gw-s3 Fallback'. Он опубликован, то есть
# известен всем — пока плата стоит в режиме настройки, к ней может
# подключиться любой, кто рядом. Настроили сеть — плата уходит в неё,
# и точка доступа больше не поднимается.
# Совпадает по слову с логином/паролем Web UI (radex/radex) — проще запомнить.
# WPA2 требует минимум 8 символов, поэтому не голое "radex" (5 симв.).
ap_password: "radex123"

# Пароль обновления по воздуху. Публичный: смените его, если плата
# смотрит в недоверенную сеть (пересобрать прошивку со своим значением).
ota_password: "radexota"

# Вход в Web UI. Тоже публичный — поменяйте при пересборке.
web_server_auth_user: "radex"
web_server_auth_pass: "radex"